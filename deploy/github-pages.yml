# 기회레이더를 GitHub Pages로 운영하는 워크플로 예시입니다.
# 사용하려면 이 파일을 저장소 루트의 .github/workflows/ 아래로 복사하세요.
#
# 준비
#   1. 저장소 Settings → Secrets and variables → Actions → Secrets 에 등록
#        공공 API  : BIZINFO_API_KEY, DATA_GO_KR_API_KEY, YOUTH_API_KEY  (없는 출처는 건너뜁니다)
#        알림(선택): ALERTS_JSON (화면의 '이 조건으로 알림 받기'에서 복사)
#                    TELEGRAM_BOT_TOKEN / RESEND_API_KEY, ALERT_EMAIL_FROM
#      필요하면 Variables 에 G2B_KEYWORDS (예: 플랫폼,홍보,교육) 등록
#   2. Settings → Pages → Source 를 "GitHub Actions" 로 지정
#
# 매일 아침 공고를 모아 data/opportunities.json 을 만들고, 어제 배포된 결과와 비교해 알림을 보낸 뒤
# 사이트와 함께 배포합니다. 인증키와 알림 설정은 이 작업 안에서만 쓰이고 배포 결과물에는 들어가지 않습니다.

name: 기회레이더 수집·알림·배포

on:
  schedule:
    - cron: "50 20 * * *" # 매일 05:50 (KST)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: opportunity-radar-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5

      - name: 규칙 테스트
        working-directory: opportunity-radar
        run: npm test

      - name: 어제 배포된 결과 받기 (알림 비교용)
        working-directory: opportunity-radar
        run: curl -fsSL "${{ steps.pages.outputs.base_url }}/data/opportunities.json" -o data/previous.json || echo "어제 결과가 없습니다 (첫 배포)"

      - name: 공고 수집
        working-directory: opportunity-radar
        env:
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          YOUTH_API_KEY: ${{ secrets.YOUTH_API_KEY }}
          G2B_KEYWORDS: ${{ vars.G2B_KEYWORDS }}
        run: node collector/collect.mjs

      - name: 알림 보내기
        working-directory: opportunity-radar
        continue-on-error: true # 알림이 실패해도 사이트 배포는 계속합니다
        env:
          ALERTS_JSON: ${{ secrets.ALERTS_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node collector/notify.mjs --current data/opportunities.json --prev data/previous.json

      - name: 비교용 파일 정리
        working-directory: opportunity-radar
        run: rm -f data/previous.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: opportunity-radar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
